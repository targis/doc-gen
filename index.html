<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор документів</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f6f8;
      }

      .container {
        max-width: 1100px;
        margin-top: 40px;
      }

      .card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      textarea {
        font-family: monospace;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-C54SNnuY.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-stDfeQAy.css">
  </head>

  <body>
    <div class="container">
      <div class="card p-4">
        <!-- INPUT STATE -->
        <div id="inputState">
          <h2 class="mb-4">Створення документа</h2>
          <textarea
            id="input"
            rows="4"
            class="d-none form-control"
            placeholder="Встав сюди рядок з Google Sheets (Ctrl+V)"
          ></textarea>
          <button id="pasteBtn" class="btn btn-primary">
            Вставити з буфера
          </button>
        </div>

        <!-- PREVIEW STATE -->
        <div id="previewState" class="mt-3" style="display: none">
          <h3 class="mb-3">Перевірка даних</h3>
          <div id="previewStateTable" class="mb-3"></div>
          <div class="mb-3 row g-3">
            <div class="col-md-3">
              <label for="docDate" class="form-label">Дата документа:</label>
              <input type="date" id="docDate" class="form-control mb-3" />
            </div>
            <div
              class="col-md-3 offset-md-1"
              id="calcFields"
              style="display: none"
            >
              <label for="calcDate" class="form-label">Дата розрахунків:</label>
              <input type="date" id="calcDate" class="form-control mb-3" />
            </div>
          </div>

          <!-- ACTION BUTTONS (тільки для preview) -->
          <div id="actionButtons" class="d-flex gap-2 mt-3">
            <button id="editBtn" class="btn btn-secondary">Скасувати</button>

            <button id="confirmBtn" class="btn btn-primary">
              Створити документ
            </button>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
